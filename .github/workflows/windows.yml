name: Windows portable

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish v<workspace version> after all checks pass
        type: boolean
        default: false
      reuse_build_run:
        description: Optional successful binary-build run for packaging-only changes
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

defaults:
  run:
    shell: pwsh

env:
  CARGO_TERM_COLOR: always

jobs:
  # fmt and clippy compile the dev profile, so they run beside the release build (#117).
  lint:
    if: ${{ !inputs.reuse_build_run }}
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.98.1-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Build tools
        run: |
          python scripts/setup-build-tools.py build/tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "${{ github.workspace }}\build\tools\winlibs\mingw64\bin" >> $env:GITHUB_PATH
          "GPUI_FXC_PATH=${{ github.workspace }}\build\tools\sdk\c\bin\10.0.28000.0\x64\fxc.exe" >> $env:GITHUB_ENV
          rustup toolchain install 1.98.1-x86_64-pc-windows-gnu --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: windows-gnu-lint-v1
      - name: fmt and clippy
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          exit $LASTEXITCODE

  rust:
    if: ${{ !inputs.reuse_build_run }}
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      # rust-toolchain.toml has no host triple (#102); the runner's default host is MSVC.
      RUSTUP_TOOLCHAIN: 1.98.1-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Build tools
        run: |
          python scripts/setup-build-tools.py build/tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "${{ github.workspace }}\build\tools\winlibs\mingw64\bin" >> $env:GITHUB_PATH
          "GPUI_FXC_PATH=${{ github.workspace }}\build\tools\sdk\c\bin\10.0.28000.0\x64\fxc.exe" >> $env:GITHUB_ENV
          rustup toolchain install 1.98.1-x86_64-pc-windows-gnu --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Caches dependencies only; workspace crates are rebuilt every run anyway (#117).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: windows-gnu-release-v2
      - name: Build and test
        run: |
          cargo build --locked --release --bins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --release --workspace
          exit $LASTEXITCODE
      - name: Parallel session smoke (mock workers)
        run: |
          Set-Content build/mock.rom 'mock'
          python tools/bench_parallel.py --smoke --server target/release/lotus-mcp.exe --worker mock=target/release/lotus-mock-native.exe --rom "mock=$PWD/build/mock.rom" --workers 2 --output build/bench-parallel-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/bench_parallel.py --smoke --stall --server target/release/lotus-mcp.exe --worker mock=target/release/lotus-mock-native.exe --rom "mock=$PWD/build/mock.rom" --workers 2 --output build/bench-parallel-stall
          exit $LASTEXITCODE
      - name: Stage applications and notices
        run: |
          cargo metadata --locked --format-version 1 --filter-platform x86_64-pc-windows-gnu > build/metadata.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package-windows.py rust --binary-dir target/release --metadata build/metadata.json --output build/rust-artifact --dll-dir build/tools/winlibs/mingw64/bin
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-applications
          path: build/rust-artifact/
          if-no-files-found: error
          retention-days: 7

  native:
    if: ${{ !inputs.reuse_build_run }}
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        branch: [integration, experimental]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Build tools
        run: |
          python scripts/setup-build-tools.py build/tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "${{ github.workspace }}\build\tools\winlibs\mingw64\bin" >> $env:GITHUB_PATH
      - name: Pinned native source
        run: |
          Import-Module ./scripts/Pins.psm1
          $pins = Read-Pins config/pins.toml
          git clone --no-checkout $pins['azahar']['fork'] build/native-source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C build/native-source checkout --detach $pins['azahar']['${{ matrix.branch }}_commit']
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C build/native-source submodule update --init --recursive --depth 1
          exit $LASTEXITCODE
      - name: Native build and contract checks
        run: |
          ./scripts/build-azahar.ps1 -Branch ${{ matrix.branch }} -AzaharRoot build/native-source -BuildDirectory build/native -Parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/native/bin/Release/ctr-worker.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_native_protocol.py build/native/bin/Release/ctr-worker.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package-windows.py runtime --build build/native --output build/native-artifact --dll-dir build/tools/winlibs/mingw64/bin
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-${{ matrix.branch }}
          path: build/native-artifact/
          if-no-files-found: error
          retention-days: 7

  package:
    if: ${{ always() && !cancelled() && (inputs.reuse_build_run || (needs.lint.result == 'success' && needs.rust.result == 'success' && needs.native.result == 'success')) }}
    needs: [lint, rust, native]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Validate reused build provenance
        if: inputs.reuse_build_run
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.reuse_build_run }}
        run: |
          python scripts/validate-build-reuse.py $env:BUILD_RUN
          exit $LASTEXITCODE
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rust-applications
          path: build/rust-artifact
          run-id: ${{ inputs.reuse_build_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-integration
          path: build/azahar-artifact
          run-id: ${{ inputs.reuse_build_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-experimental
          path: build/citnlo-artifact
          run-id: ${{ inputs.reuse_build_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Assemble and test portable ZIP
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and Cargo version differ' }
          python scripts/package-windows.py assemble --rust build/rust-artifact --azahar build/azahar-artifact --citnlo build/citnlo-artifact --output build/dist --version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_portable.py "build/dist/LOTUS-v$version-windows-x64.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # lotus#42: the ZIP's host against both of its workers on the owned debugger fixture
          # (clang from the runner image). Publication needs this job, so a failure blocks it.
          python tools/build-debug-fixture.py build/fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_packaged.py --zip "build/dist/LOTUS-v$version-windows-x64.zip" build/fixture/debugger.3dsx build/fixture/debugger.elf build/packaged
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item build/packaged/packaged.json "build/dist/LOTUS-v$version-packaged-acceptance.json"
          python scripts/archive-source.py "build/dist/LOTUS-v$version-source.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem build/dist/*.zip, build/dist/*.json | ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content build/dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LOTUS-windows-x64
          path: |
            build/dist/*.zip
            build/dist/*-packaged-acceptance.json
            build/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
  release:
    # always(): reuse mode skips rust/native, which would otherwise skip this job transitively.
    if: ${{ always() && !cancelled() && needs.package.result == 'success' && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)) }}
    needs: package
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: LOTUS-windows-x64
          path: build/dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          if (-not $version) { throw 'Missing workspace version' }
          $tag = "v$version"
          $verify = @()
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME; $verify = @('--verify-tag') }
          $assets = @(Get-ChildItem build/dist/*.zip, build/dist/*-packaged-acceptance.json | ForEach-Object FullName)
          gh release create $tag @assets build/dist/SHA256SUMS.txt @verify --target $env:GITHUB_SHA --title "LOTUS $tag" --notes-file packaging/release-notes.md
          exit $LASTEXITCODE
