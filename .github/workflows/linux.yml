name: Linux

# Rust workspace only: desktop, MCP, CLI and mock workers (#102). Native Azahar
# builds and Linux packaging are separate jobs (#103-#109).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # One package per -sys crate in Cargo.lock; docs/27 section 10 maps them.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libfontconfig-dev libudev-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev
      - name: Toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustc -vV
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-release-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: linux-release-v1-${{ runner.os }}-
      - name: Check and build
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo build --locked --release --bins
          cargo build --locked --release --bin lotus-desktop --bin lotus-mcp --bin ctr-cli
          cargo test --locked --release --workspace
      - name: Headless smoke
        run: python3 tests/test_headless_smoke.py target/release
      - name: Provenance
        run: |
          mkdir -p build
          {
            echo "revision=${{ github.sha }}"
            rustc -vV
            cargo -V
            grep -A2 '^name = "gpui"$' Cargo.lock
            dpkg-query -W build-essential pkg-config cmake libfontconfig-dev libudev-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev
            sha256sum target/release/lotus-desktop target/release/lotus-mcp target/release/ctr-cli
          } | tee build/linux-provenance.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-rust-provenance
          path: build/linux-provenance.txt
