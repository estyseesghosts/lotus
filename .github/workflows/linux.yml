name: Linux

# Rust workspace only: desktop, MCP, CLI and mock workers (#102). Native Azahar
# builds and Linux packaging are separate jobs (#103-#109).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # mold links the GPUI binaries faster than bfd (#117).
  RUSTFLAGS: -C link-arg=-fuse-ld=mold

jobs:
  # fmt and clippy compile the dev profile, so they run beside the release build (#117).
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # One package per -sys crate in Cargo.lock; docs/27 section 10 maps them.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake mold \
            libfontconfig-dev libudev-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev
      - name: Toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustc -vV
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: linux-lint-v1
      - name: fmt and clippy
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          python3 tests/test_build_config.py

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # One package per -sys crate in Cargo.lock; docs/27 section 10 maps them.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake mold \
            libfontconfig-dev libudev-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev
      - name: Toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustc -vV
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: linux-release-v2
      - name: Build and test
        run: |
          cargo build --locked --release --bins
          cargo build --locked --release --bin lotus-desktop --bin lotus-mcp --bin ctr-cli
          cargo test --locked --release --workspace
      - name: Headless smoke
        run: python3 tests/test_headless_smoke.py target/release
      - name: Provenance
        run: |
          mkdir -p build
          {
            echo "revision=${{ github.sha }}"
            rustc -vV
            cargo -V
            grep -A2 '^name = "gpui"$' Cargo.lock
            dpkg-query -W build-essential pkg-config cmake mold libfontconfig-dev libudev-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev
            sha256sum target/release/lotus-desktop target/release/lotus-mcp target/release/ctr-cli
          } | tee build/linux-provenance.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-rust-provenance
          path: build/linux-provenance.txt
