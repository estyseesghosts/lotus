name: Linux

# Rust workspace only: desktop, MCP, CLI and mock workers (#102). Native Azahar
# builds and Linux packaging are separate jobs (#103-#109).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  # mold links the GPUI binaries faster than bfd (#117).
  RUSTFLAGS: -C link-arg=-fuse-ld=mold

jobs:
  # fmt and clippy compile the dev profile, so they run beside the release build (#117).
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # One package per -sys crate in Cargo.lock; docs/27 section 10 maps them.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake mold \
            libfontconfig-dev libudev-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev
      - name: Toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustc -vV
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: linux-lint-v1
      - name: fmt and clippy
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          python3 tests/test_build_config.py

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # One package per -sys crate in Cargo.lock; docs/27 section 10 maps them.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake mold \
            libfontconfig-dev libudev-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev
      - name: Toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustc -vV
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: linux-release-v2
      - name: Build and test
        run: |
          cargo build --locked --release --bins
          cargo build --locked --release --bin lotus-desktop --bin lotus-mcp --bin ctr-cli
          cargo test --locked --release --workspace
      - name: Headless smoke
        run: |
          python3 tests/test_headless_smoke.py target/release
          python3 tests/test_apprun.py
      - name: Provenance
        run: |
          mkdir -p build
          {
            echo "revision=${{ github.sha }}"
            rustc -vV
            cargo -V
            grep -A2 '^name = "gpui"$' Cargo.lock
            dpkg-query -W build-essential pkg-config cmake mold libfontconfig-dev libudev-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev
            sha256sum target/release/lotus-desktop target/release/lotus-mcp target/release/ctr-cli
          } | tee build/linux-provenance.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-rust-provenance
          path: build/linux-provenance.txt
      - name: Stage applications
        run: |
          cargo metadata --locked --format-version 1 --filter-platform x86_64-unknown-linux-gnu > build/metadata.json
          tar -cf build/rust-linux.tar -C target/release lotus-desktop lotus-mcp ctr-cli -C ../../build metadata.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-linux
          path: build/rust-linux.tar
          if-no-files-found: error
          retention-days: 7

  # Pinned ctr-worker per flavor, each in its own source and build tree (#103).
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        branch: [integration, experimental]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential cmake ninja-build pkg-config git libpulse-dev libasound2-dev
      - name: Pinned native source
        run: |
          commit=$(python3 -c 'import tomllib; print(tomllib.load(open("config/pins.toml","rb"))["azahar"]["${{ matrix.branch }}_commit"])')
          git clone --no-checkout https://github.com/estyseesghosts/azahar.git build/native-source
          git -C build/native-source checkout --detach "$commit"
          git -C build/native-source submodule update --init --recursive --depth 1
      - name: Native build and contract checks
        run: |
          bash scripts/build-azahar.sh ${{ matrix.branch }} build/native-source build/native "$(nproc)"
          worker=$(ls build/native/bin/*/ctr-worker build/native/bin/ctr-worker 2>/dev/null | head -1)
          "$worker" --self-test
          python3 tests/test_native_protocol.py "$worker"
          cp "$worker" build/native/ctr-worker
          tar -cf build/native-${{ matrix.branch }}.tar -C build/native ctr-worker lotus-build-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux-${{ matrix.branch }}
          path: build/native-${{ matrix.branch }}.tar
          if-no-files-found: error
          retention-days: 7

  # One AppImage from the tested artifacts (#108); published only from a tag (#109).
  appimage:
    needs: [lint, rust, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: '{rust-linux,native-linux-*}'
          path: build/in
          merge-multiple: true
      - name: Assemble and test AppImage
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends file libxkbcommon-x11-0 libxcb-xkb1
          rustup toolchain install 1.98.1 --profile minimal
          mkdir -p build/rust build/azahar build/citnlo build/tools
          tar -xf build/in/rust-linux.tar -C build/rust
          tar -xf build/in/native-integration.tar -C build/azahar
          tar -xf build/in/native-experimental.tar -C build/citnlo
          curl -sSfL -o build/tools/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -sSfL -o build/tools/runtime https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          chmod +x build/tools/appimagetool
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then echo 'Tag and Cargo version differ'; exit 1; fi
          python3 scripts/package-linux.py --rust build/rust --metadata build/rust/metadata.json             --azahar build/azahar --citnlo build/citnlo --version "$version" --output build/dist             --appimagetool build/tools/appimagetool --runtime build/tools/runtime
          python3 tests/test_appimage.py "build/dist/LOTUS-v$version-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LOTUS-linux-x86_64
          path: |
            build/dist/*.AppImage
            build/dist/*.AppImage.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish to tagged release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh "$GITHUB_REF_NAME" build/dist/*.AppImage build/dist/*.AppImage.sha256
