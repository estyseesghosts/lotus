[package]
name = "lotus-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Host-owned physical controller discovery and events."

[dependencies]
# `wgi` and `xinput` are mutually exclusive in gilrs-core; see lib.rs.
gilrs = { version = "=0.11.2", default-features = false, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[features]
default = ["wgi"]
# The gilrs backend; off, the crate is the layout and router only (used by lotus-session).
backend = ["dep:gilrs"]
wgi = ["backend", "gilrs/wgi"]
xinput = ["backend", "gilrs/xinput"]

[[bin]]
name = "lotus-pads"
required-features = ["backend"]
