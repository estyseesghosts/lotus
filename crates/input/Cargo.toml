[package]
name = "lotus-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Host-owned physical controller discovery and events."

[dependencies]
# `wgi` and `xinput` are mutually exclusive in gilrs-core; see lib.rs.
gilrs = { version = "=0.11.2", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[features]
default = ["wgi"]
wgi = ["gilrs/wgi"]
xinput = ["gilrs/xinput"]
