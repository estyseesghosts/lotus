[package]
name = "lotus-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "GPUI desktop application: sessions, screens and debugger views."

[lib]
name = "lotus_desktop"
path = "src/lib.rs"

[[bin]]
name = "lotus-desktop"
path = "src/main.rs"

[dependencies]
image = { version = "=0.25.10", default-features = false }
lotus-accuracy = { workspace = true }
lotus-debugger = { workspace = true }
lotus-hardware = { workspace = true }
lotus-mcp = { workspace = true }
lotus-protocol = { workspace = true }
lotus-session = { workspace = true }
lotus-trace = { workspace = true }
gpui = { workspace = true }
gpui_platform = { workspace = true }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
discord-rich-presence = "=1.1.0"

[target.'cfg(windows)'.dependencies]
# Versions already locked through GPUI; used to re-show a window started hidden (main.rs).
raw-window-handle = "=0.6.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "lotus-screen-spike"
path = "src/screen_spike.rs"

