[package]
name = "lotus-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "GPUI desktop application: sessions, screens and debugger views."

[lib]
name = "lotus_desktop"
path = "src/lib.rs"

[[bin]]
name = "lotus-desktop"
path = "src/main.rs"

[dependencies]
image = { version = "=0.25.10", default-features = false }
lotus-accuracy = { workspace = true }
lotus-debugger = { workspace = true }
lotus-hardware = { workspace = true }
lotus-mcp = { workspace = true }
lotus-protocol = { workspace = true }
lotus-settings = { workspace = true }
lotus-session = { workspace = true }
lotus-input = { workspace = true }
lotus-trace = { workspace = true }
gpui = { workspace = true }
gpui_platform = { workspace = true }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
discord-rich-presence = "=1.1.0"
# Pinned source snapshot. See config/pins.toml [silvestris] and docs/38.
silvestris = { path = "../../vendor/silvestris/crates/silvestris", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Without a backend gpui_linux runs headless and `run` returns at once (gpui_platform
# Cargo.toml `wayland`/`x11` features; gpui_linux `current_platform`).
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

[target.'cfg(windows)'.dependencies]
# Versions already locked through GPUI; used to re-show a window started hidden (main.rs).
raw-window-handle = "=0.6.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "lotus-screen-spike"
path = "src/screen_spike.rs"

[features]
# The portable desktop uses Silvestris. Disable default features and select
# wgi (or xinput) to build the legacy renderer.
default = ["wgi", "silvestris-ui"]
# gilrs backends, passed through to lotus-input. The two are mutually exclusive.
wgi = ["lotus-input/wgi"]
xinput = ["lotus-input/xinput"]
silvestris-ui = ["dep:silvestris"]

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
silvestris = { path = "../../vendor/silvestris/crates/silvestris", features = ["test-support"] }
