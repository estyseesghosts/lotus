[package]
name = "lotus-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "GPUI desktop application: sessions, screens and debugger views."

[lib]
name = "lotus_desktop"
path = "src/lib.rs"

[[bin]]
name = "lotus-desktop"
path = "src/main.rs"

[dependencies]
image = { version = "=0.25.10", default-features = false }
lotus-accuracy = { workspace = true }
lotus-debugger = { workspace = true }
lotus-hardware = { workspace = true }
lotus-mcp = { workspace = true }
lotus-protocol = { workspace = true }
lotus-settings = { workspace = true }
lotus-session = { workspace = true }
lotus-input = { workspace = true }
lotus-trace = { workspace = true }
gpui = { workspace = true }
gpui_platform = { workspace = true }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
discord-rich-presence = "=1.1.0"
# Staging source checkout; see config/pins.toml [silvestris] and docs/38.
silvestris = { path = "../../../../silvestris/crates/silvestris", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Without a backend gpui_linux runs headless and `run` returns at once (gpui_platform
# Cargo.toml `wayland`/`x11` features; gpui_linux `current_platform`).
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

[target.'cfg(windows)'.dependencies]
# Versions already locked through GPUI; used to re-show a window started hidden (main.rs).
raw-window-handle = "=0.6.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "lotus-screen-spike"
path = "src/screen_spike.rs"

[features]
# gilrs backend, passed through to lotus-input; the two are mutually exclusive.
default = ["wgi"]
wgi = ["lotus-input/wgi"]
xinput = ["lotus-input/xinput"]
# Incremental adoption only; the legacy shell remains the default.
silvestris-ui = ["dep:silvestris"]
