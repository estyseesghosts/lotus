[package]
name = "lotus-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Worker process lifecycle, isolation and session state for the Rust application."

[dependencies]
lotus-debugger.workspace = true
tokio = { workspace = true }
lotus-protocol = { workspace = true }
lotus-input = { workspace = true }
lotus-settings = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
md-5 = "=0.10.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Memory", "Win32_System_SystemInformation"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[[bin]]
name = "lotus-mock-worker"
path = "src/mock_worker.rs"

[[bin]]
name = "lotus-mock-native"
path = "src/mock_native.rs"
