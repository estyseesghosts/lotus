[package]
name = "lotus-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command line interface for scenarios, pinned revisions and headless runs."

[[bin]]
name = "ctr-cli"
path = "src/main.rs"

[dependencies]
lotus-gdb.workspace = true
lotus-protocol = { workspace = true }
lotus-settings = { workspace = true }
lotus-runner = { workspace = true }
lotus-session = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }

[target.'cfg(windows)'.dependencies]
lotus-mcp.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
